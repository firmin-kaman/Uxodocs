name: Deploy to GitHub Pages (docusaurus branch)

on:
  push:
    branches:
      - gh-pages
      - docusaurus

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docusaurus

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Docusaurus
        run: bun run build

      - name: Verify build
        run: ls -la build/

      - name: Commit and push built files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/  # Force l'ajout du dossier build
          git commit -m "Deploy Docusaurus to docusaurus branch"
          git push origin docusaurus
